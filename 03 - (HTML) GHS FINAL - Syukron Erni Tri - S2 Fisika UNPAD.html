<script>
/*
=======================================================================
          G E R A K   H A R M O N I K   S E D E R H A N A
                     GHS LEARNING UNIVERSE
                         P5.JS ALL-IN-ONE
=======================================================================
Universitas Padjadjaran — S2 Fisika
1. Mohammad Syukron Amrulloh (NPM : 140820260033)
2. Tri Utomo Budi (NPM : 140820260006)
3. Erni Saputri (NPM : 140820260017)

LIMA MODUL ASLI DISERTAKAN UTUH (VERBATIM) DI DALAM SATU sketch.js:
  1. Virtual Lab Bandul Matematis
  2. Virtual Lab Pegas Vertikal
  3. Virtual Lab Kombinasi Bandul dan Pegas
  4. Physics Crossword Quest: LOTS, MOTS, HOTS
  5. Physics Millionaire: LOTS, MOTS, HOTS + Conclusion

TANPA index.html, JSON, audio, CSS, atau file tambahan.
Buka https://editor.p5js.org, buat sketch baru, lalu tempel berkas ini.

Integrasi dilakukan dengan PEMBUNGKUS SKOP per modul untuk menghindari
benturan setup(), draw(), variabel global dan kontrol input. Isi sumber
asli di antara penanda SOURCE_BEGIN / SOURCE_END tidak diubah.

PINTASAN: CTRL + SHIFT + H = kembali ke beranda utama.
Saat di dalam modul, tersedia tombol 'MENU UTAMA' di kanan bawah.
=======================================================================
*/

const GHS_CORE = (() => {
  'use strict';
  const W=1600, H=1200;
  let stage=null, stageOuter=null, canvas=null;
  let modules=null, initialized=new Set(), active='home';
  let controls={bandul:[]};
  let hitAreas=[],hoverId='',homeTick=0;
  let notification='',notificationUntil=0;
  const AUTHORS=[
    '1. Mohammad Syukron Amrulloh (NPM : 140820260033)',
    '2. Tri Utomo Budi (NPM : 140820260006)',
    '3. Erni Saputri (NPM : 140820260017)'
  ];
  const P={navy:'#234D7D',deep:'#122B4B',blue:'#3977BD',teal:'#27A695',
    gold:'#F2C873',goldDeep:'#D4993A',bg:'#F1F6FB',ink:'#2B4058',
    line:'#CCDFED',pale:'#E8F4FC',white:'#FFFFFF'};
  const subOptions=[
    {id:'bandul',title:'BANDUL MATEMATIS',sub:'Eksplorasi periode, sudut dan gravitasi',detail:'Ubah panjang tali, massa, sudut, planet, dan energi. Amati secara langsung lintasan bandul beserta grafiknya.',icon:'pendulum',level:'LAB 01'},
    {id:'pegas',title:'PEGAS VERTIKAL',sub:'Tantangan massa, k, redaman dan energi',detail:'Tarik beban pegas ke atas atau ke bawah; selidiki pertambahan panjang dan gerak osilasi.',icon:'spring',level:'LAB 02'},
    {id:'kombinasi',title:'KOMBINASI BANDUL–PEGAS',sub:'Dua osilator, satu eksperimen komparatif',detail:'Bandingkan kedua alat dan cari parameter yang membuat periode getarannya selaras.',icon:'dual',level:'LAB 03'}
  ];

  function makeMount(){
    // Semua halaman (termasuk DOM bandul asli) menempati satu koordinat 1600x1200.
    const body=document.body;
    body.style.margin='0'; body.style.padding='0';
    body.style.background='#E6EFF8'; body.style.overflowX='hidden';
    stageOuter=document.createElement('div');
    stageOuter.style.position='relative'; stageOuter.style.margin='0 auto';
    stageOuter.style.overflow='visible';
    stage=document.createElement('div');
    stage.style.width=W+'px'; stage.style.height=H+'px';
    stage.style.position='relative'; stage.style.transformOrigin='0 0';
    stage.style.overflow='visible';
    stageOuter.appendChild(stage); body.appendChild(stageOuter);
    scaleStage();
  }
  function scaleStage(){
    if(!stage||!stageOuter)return;
    // Penskalaan canvas dan kontrol bandul dalam satu kontainer terjaga.
    const availableWidth=Math.max(290,window.innerWidth-12);
    const factor=Math.min(1,availableWidth/W);
    stage.style.transform='scale('+factor+')';
    stageOuter.style.width=(W*factor)+'px';
    stageOuter.style.height=(H*factor)+'px';
  }
  function setupApp(){
    makeMount();
    canvas=createCanvas(W,H);
    canvas.parent(stage);
    canvas.style('display','block');
    canvas.style('width',W+'px');canvas.style('height',H+'px');
    canvas.elt.style.touchAction='manipulation';
    pixelDensity(1); textFont('Arial');
    active='home';
  }
  function attachModules(value){modules=value;}
  function canvasForModule(w,h){
    if(w!==W||h!==H)throw new Error('Modul harus memakai canvas 1600 x 1200.');
    return canvas;
  }
  function registerDOM(moduleName,factory,args){
    // Versi lama bandul menggunakan elemen p5 DOM. Semua tetap dibuat dengan
    // API p5 asli, tetapi diparent ke kontainer bersama agar sejajar canvas.
    const native=window[factory];
    if(typeof native!=='function')throw new Error('p5 DOM API tidak ditemukan: '+factory);
    const element=native(...args);
    if(typeof element.parent==='function') element.parent(stage);
    if(!controls[moduleName])controls[moduleName]=[];
    controls[moduleName].push({element,display:element.elt.style.display||''});
    return element;
  }
  function scopeFor(name){
    return {
      createCanvas:(...args)=>canvasForModule(...args),
      createDOM:(method,...args)=>registerDOM(name,method,args)
    };
  }
  function toggleDOM(name,show){
    for(const entry of (controls[name]||[])){
      entry.element.elt.style.display=show?entry.display:'none';
    }
  }
  function activate(name){
    if(name!=='home'&&name!=='labMenu'&&!modules[name])return;
    if(active==='bandul')toggleDOM('bandul',false);
    active=name; hitAreas=[];
    // Gunakan instance canvas yang sama; setup modul hanya sekali.
    if(modules&&modules[name]&&!initialized.has(name)){
      modules[name].setup();
      initialized.add(name);
    }
    if(name==='bandul')toggleDOM('bandul',true);
    if(name==='home'||name==='labMenu'){
      document.title='GERAK HARMONIK SEDERHANA | UNIVERSITAS PADJADJARAN';
    }
  }
  function colorBg(){
    resetMatrix(); colorMode(RGB,255,255,255,255);
    rectMode(CORNER); ellipseMode(CENTER); imageMode(CORNER);
    textAlign(LEFT,BASELINE); textStyle(NORMAL); strokeCap(ROUND);
    blendMode(BLEND); background(241,246,251);
  }
  function gradient(x,y,w,h,a,b,vertical=true,r=0){
    push(); noStroke();
    const ctx=drawingContext;
    ctx.save(); const gr=ctx.createLinearGradient(x,y,x+(vertical?0:w),y+(vertical?h:0));
    gr.addColorStop(0,a);gr.addColorStop(1,b);
    ctx.fillStyle=gr;
    ctx.beginPath();
    if(typeof ctx.roundRect==='function')ctx.roundRect(x,y,w,h,r);
    else ctx.rect(x,y,w,h);
    ctx.fill();ctx.restore();pop();
  }
  function txt(s,x,y,size=16,col=P.ink,bold=false,align=LEFT){
    push();noStroke();fill(col);textFont('Arial');textSize(size);
    textStyle(bold?BOLD:NORMAL);textAlign(align,BASELINE);text(String(s),x,y);pop();
  }
  function wrap(s,x,y,w,h,size=16,col=P.ink,leading=23){
    push();noStroke();fill(col);textFont('Arial');textSize(size);textLeading(leading);
    textAlign(LEFT,TOP);text(String(s),x,y,w,h);pop();
  }
  function box(x,y,w,h,shade='#FFFFFF',radius=18,border='#C8D9E8'){
    push();fill(shade);stroke(border);strokeWeight(1.7);rect(x,y,w,h,radius);pop();
  }
  function hit(x,y,w,h,fn,id){hitAreas.push({x,y,w,h,fn,id});}
  function inBox(x,y,w,h){return mouseX>=x&&mouseX<=x+w&&mouseY>=y&&mouseY<=y+h;}
  function btn(label,x,y,w,h,click,theme='gold',fontSize=16){
    const activeHover=inBox(x,y,w,h);
    if(theme==='gold')gradient(x,y,w,h,activeHover?'#FFF0BE':'#F8D98E','#EFB959',false,12);
    else gradient(x,y,w,h,activeHover?'#EAF6FD':'#FFFFFF','#E9F3FA',false,12);
    push();stroke(theme==='gold'?'#D9AA52':'#A8C5DD');strokeWeight(1);noFill();rect(x,y,w,h,12);pop();
    txt(label,x+w/2,y+h/2+fontSize*.35,fontSize,theme==='gold'?P.deep:P.navy,true,CENTER);
    hit(x,y,w,h,click,label);
  }
  function hud(){
    gradient(0,0,W,68,P.navy,P.deep,false,0);
    txt('UNIVERSITAS PADJADJARAN',60,42,20,'#FFFFFF',true);
    txt('S2 FISIKA  /  MEDIA PEMBELAJARAN INTERAKTIF',1542,42,15,'#BDD6EB',true,RIGHT);
    stroke('#CFA95E');strokeWeight(3);line(0,67,W,67);noStroke();
  }
  function orb(x,y,factor=1){
    push();translate(x,y);scale(factor);
    noFill();stroke('rgba(178,211,235,0.16)');strokeWeight(2);
    for(let k=0;k<4;k++)ellipse(0,0,330+k*58,210+k*55);
    for(let k=0;k<4;k++){
      const angle=homeTick*.35+k*PI/2;
      fill(k%2?'#F4CE78':'#86E2EE');noStroke();
      circle(Math.cos(angle)*(175+k*27),Math.sin(angle)*(100+k*28),7+k);
    }
    pop();
  }
  function heroPhysics(){
    // Animasi dekoratif bandul + pegas, digambar langsung di canvas p5.js.
    orb(1314,272,.71);
    const theta=.37*Math.cos(homeTick*1.45);
    const L=142,px=1256,py=203;
    const bx=px+Math.sin(theta)*L,by=py+Math.cos(theta)*L;
    push();stroke('#B8E5F2');strokeWeight(4);line(px,py,bx,by);
    noStroke();fill('#F6D286');circle(bx,by,31);
    fill('#FFFFFF');circle(px,py,11);pop();
    const cx=1450,top=205,bot=351+20*Math.cos(homeTick*2.3);
    push();stroke('#6BD6E8');strokeWeight(4);noFill();beginShape();
    for(let i=0;i<=110;i++){
      const f=i/110;
      vertex(cx+18*Math.sin(f*TWO_PI*12),top+(bot-top)*f);
    }
    endShape();noStroke();fill('#F3C76C');rect(cx-30,bot,60,46,9);pop();
    txt('T = 2π√(L/g)',1109,472,16,'#CEE8FF',true);
    txt('T = 2π√(m/k)',1354,472,16,'#F9D992',true);
  }
  function drawMenuCard(c){
    const {x,y,w,h,id,title,num,tag,desc,accent,accent2,metric,icon}=c;
    const hover=inBox(x,y,w,h);
    push();noStroke();fill('rgba(25,62,97,0.11)');rect(x+4,y+9,w,h,22);pop();
    gradient(x,y,w,h,hover?'#FFFFFF':'#FCFEFF','#EAF4FB',true,22);
    push();stroke(hover?accent:P.line);strokeWeight(hover?2.6:1.8);noFill();rect(x,y,w,h,22);pop();
    gradient(x+22,y+22,73,70,accent,accent2,false,17);
    txt(icon,x+58,y+69,36,'#FFFFFF',true,CENTER);
    txt(num,x+w-24,y+42,13,accent,true,RIGHT);
    txt(title,x+24,y+140,29,P.deep,true);
    txt(tag,x+24,y+173,13,accent,true);
    wrap(desc,x+24,y+190,w-48,85,16,P.ink,23);
    txt(metric,x+24,y+h-27,16,P.navy,true);
    btn('MULAI  ›',x+w-160,y+h-54,137,37,()=>activate(id),'gold',15);
    hit(x,y,w,h-65,()=>activate(id),'card-'+id);
  }
  function footer(){
    box(55,978,1490,178,'#FFFFFF',22,'#CBDDEB');
    gradient(55,978,1490,11,P.navy,'#4E91C4',false,10);
    txt('DIBUAT OLEH',80,1023,16,P.navy,true);
    AUTHORS.forEach((name,i)=>txt(name,80,1053+i*26,16,P.ink,false));
    txt('UNIVERSITAS PADJADJARAN',1518,1052,22,P.navy,true,RIGHT);
    txt('S2 FISIKA  •  BELAJAR, BEREKSPERIMEN, DAN BERPRESTASI',1518,1088,14,'#607B95',true,RIGHT);
    txt('Kembangkan rasa ingin tahu. Temukan polanya. Kuasai ilmunya.',1518,1122,13,'#C38E36',true,RIGHT);
  }
  function welcome(){
    gradient(55,88,1490,423,P.navy,P.deep,false,30);
    push();
    const heroClip=drawingContext;
    heroClip.save();heroClip.beginPath();heroClip.rect(1090,89,442,420);heroClip.clip();
    noFill();stroke('rgba(210,234,255,0.13)');strokeWeight(2);
    for(let i=0;i<8;i++)ellipse(1362,250,285+i*82,285+i*65);
    heroClip.restore();pop();
    txt('PHYSICS LEARNING UNIVERSE  •  INTERACTIVE EXPERIENCE',86,133,16,'#F5D58A',true);
    txt('GERAK HARMONIK',84,224,62,'#FFFFFF',true);
    txt('SEDERHANA',84,302,74,'#F7D27D',true);
    wrap('Tidak cukup hanya menghafal rumus. Sentuh, amati, uji, pecahkan misterinya, dan buktikan bahwa kamu mampu menguasai fisika!',91,327,970,70,20,'#E4F2FF',28);
    gradient(83,424,908,57,'#20496B','#285D85',false,14);
    txt('“Setiap getaran membawa peluang baru. Mulailah bereksperimen, dan jadilah penemu berikutnya!”',104,460,17,'#FFF5CF',true);
    push();
    const artClip=drawingContext;
    artClip.save();artClip.beginPath();artClip.rect(1090,102,442,390);artClip.clip();
    heroPhysics();
    artClip.restore();pop();
    txt('PILIH PETUALANGAN BELAJARMU',60,554,21,P.navy,true);
    txt('3 PILIHAN UTAMA',1538,553,14,'#66849A',true,RIGHT);
    const cards=[
      {id:'labMenu',x:55,y:570,w:480,h:333,title:'VIRTUAL LAB',num:'01 / EKSPERIMEN',tag:'COBA • MANIPULASI • AMATI',desc:'Jelajahi Bandul, Pegas Vertikal, dan Kombinasi. Ubah parameter lalu amati gerak, gaya, serta energi secara langsung.',accent:'#347DC4',accent2:'#1C4F96',metric:'3 PILIHAN PRAKTIK',icon:'⚗'},
      {id:'tts',x:560,y:570,w:480,h:333,title:'CROSSWORD QUEST',num:'02 / TEKA-TEKI',tag:'LOTS • MOTS • HOTS',desc:'Pecahkan persilangan konsep fisika, kumpulkan skor, gunakan hint, dan asah ketelitianmu di tiga papan TTS interaktif.',accent:'#249A92',accent2:'#176F8C',metric:'3 LEVEL • 60 SOAL',icon:'✦'},
      {id:'millionaire',x:1065,y:570,w:480,h:333,title:'PHYSICS MILLIONAIRE',num:'03 / GRAND CHALLENGE',tag:'JAWAB • NAIK LEVEL • MENANG',desc:'Taklukkan soal LOTS hingga HOTS, manfaatkan bantuan, pelajari setiap pembahasan, dan raih peluang kedua di Bonus Chance.',accent:'#C99737',accent2:'#AD6C24',metric:'30 SOAL • BONUS ROUND',icon:'★'}
    ];
    cards.forEach(drawMenuCard);
    footer();
    hitAreas.push({x:0,y:0,w:0,h:0,fn:()=>{},id:'unused'});
  }
  function drawLabMenu(){
    gradient(55,91,1490,270,P.navy,P.deep,false,25);
    txt('VIRTUAL LAB FISIKA',81,159,43,'#FFFFFF',true);
    txt('TIGA MODEL GERAK HARMONIK',83,210,27,'#F3D187',true);
    wrap('Pilih sebuah laboratorium, ubah parameter fisika, lalu bandingkan bukti yang kamu amati dengan prediksi teoritis. Di sini, rumus menjadi pengalaman nyata.',83,237,1325,85,20,'#E8F4FF',27);
    txt('PILIH JENIS EKSPERIMEN',60,429,23,P.navy,true);
    subOptions.forEach((mod,i)=>{
      const x=55+i*505,y=456,w=480,h=395;
      const hover=inBox(x,y,w,h);
      push();noStroke();fill('rgba(20,60,100,0.10)');rect(x+4,y+8,w,h,25);pop();
      gradient(x,y,w,h,hover?'#FFFFFF':'#FCFEFF','#E8F2FA',true,24);
      push();stroke(hover?'#D0A14A':P.line);strokeWeight(hover?2.8:1.7);noFill();rect(x,y,w,h,24);pop();
      gradient(x+23,y+25,87,86,i===0?'#356CB5':i===1?'#249B9C':'#9A74B9',i===0?'#173D70':i===1?'#155E76':'#563C89',false,18);
      txt(i===0?'↺':i===1?'≋':'∞',x+67,y+81,47,'#FFFFFF',true,CENTER);
      txt(mod.level,x+454,y+44,14,P.navy,true,RIGHT);
      txt(mod.title,x+24,y+164,i===2?23:25,P.deep,true);
      txt(mod.sub,x+24,y+200,16,i===1?'#238B8E':'#3B729C',true);
      wrap(mod.detail,x+24,y+220,w-48,110,17,P.ink,25);
      btn('BUKA LABORATORIUM  ›',x+25,y+h-71,w-50,48,()=>activate(mod.id),'gold',17);
      hit(x,y,w,h-80,()=>activate(mod.id),'lab-'+mod.id);
    });
    box(55,878,1490,84,'#E5F0FA',17,'#BACEDB');
    txt('MISI SAINS:',80,930,21,P.navy,true);
    txt('Temukan pola periode, energi, dan gaya melalui eksperimen virtual.',250,930,18,P.ink);
    footer();
    btn('‹  KEMBALI KE HOME',1180,899,332,43,()=>activate('home'),'gold',17);
  }
  function floatingHome(){
    // Tombol kecil di area kanan bawah, di luar kontrol utama tiap modul.
    const x=1375,y=1155,w=205,h=39;
    gradient(x,y,w,h,'#234D7D','#112E52',false,10);
    push();stroke('#F6D07D');strokeWeight(1.5);noFill();rect(x,y,w,h,10);pop();
    txt('⌂  MENU UTAMA',x+w/2,y+26,16,'#FFFFFF',true,CENTER);
    hit(x,y,w,h,()=>activate('home'),'main-home');
  }
  function drawApp(){
    homeTick=millis()/1000;
    hitAreas=[];
    if(active==='home'||active==='labMenu'){
      colorBg();hud();
      if(active==='home')welcome();else drawLabMenu();
    }else if(modules&&modules[active]){
      // Tidak ada modifikasi isi renderer modul asli.
      modules[active].draw();
      floatingHome();
    }
    if(active==='home'||active==='labMenu'||(modules&&modules[active])){
      let h=hitAreas.some(e=>inBox(e.x,e.y,e.w,e.h));
      if(h)cursor(HAND);else if(active==='home'||active==='labMenu')cursor(ARROW);
    }
  }
  function mouseDown(){
    for(let i=hitAreas.length-1;i>=0;i--){
      const e=hitAreas[i];
      if(inBox(e.x,e.y,e.w,e.h)){e.fn();return false;}
    }
    if(modules&&modules[active]&&typeof modules[active].mousePressed==='function')
      return modules[active].mousePressed();
    return false;
  }
  function mouseDrag(){
    if(modules&&modules[active]&&typeof modules[active].mouseDragged==='function')
      return modules[active].mouseDragged();
    return false;
  }
  function mouseRelease(){
    if(modules&&modules[active]&&typeof modules[active].mouseReleased==='function')
      return modules[active].mouseReleased();
    return false;
  }
  function pressKey(){
    const mod=modules&&modules[active];
    if(keyIsDown(CONTROL)&&keyIsDown(SHIFT)&&(key==='h'||key==='H')){
      activate('home');return false;
    }
    if(active==='home'){
      if(key==='1'){activate('labMenu');return false;}
      if(key==='2'){activate('tts');return false;}
      if(key==='3'){activate('millionaire');return false;}

// ============================================================
// 16. UPDATE PARAMETER
// ============================================================

function updateParameters() {

  omega =
    sqrt(g / L);


  period =
    TWO_PI *
    sqrt(L / g);


  frequency =
    1 / period;


  updatePhysics();
}


// ============================================================
// 17. UPDATE FISIKA
// ============================================================

function updatePhysics() {

  let thetaMax =
    radians(thetaMaxDeg);


  // Sudut bandul
  theta =
    thetaMax *
    cos(
      omega *
      simTime
    );


  // Kecepatan sudut
  angularVelocity =
    -thetaMax *
    omega *
    sin(
      omega *
      simTime
    );


  // Kecepatan linear
  velocity =
    L *
    angularVelocity;


  // Percepatan tangensial
  acceleration =
    -g *
    sin(theta);


  // Ketinggian
  h =
    L *
    (1 - cos(theta));


  // Energi potensial
  Ep =
    m *
    g *
    h;


  // Energi kinetik
  Ek =
    0.5 *
    m *
    velocity *
    velocity;


  // Energi mekanik
  Em =
    Ek + Ep;


  // ==========================================================
  // POSISI BANDUL
  // ==========================================================

  let visualLength =
    map(
      L,
      0.2,
      3,
      120,
      330
    );


  bobX =
    pivotX +
    visualLength *
    sin(theta);


  bobY =
    pivotY +
    visualLength *
    cos(theta);


  // ==========================================================
  // COUNTER GETARAN
  // ==========================================================

  let direction =
    angularVelocity >= 0
      ? 1
      : -1;


  if (
    previousDirection !== 0 &&
    direction !== previousDirection
  ) {

    oscillations += 0.5;
  }


  previousDirection =
    direction;
}

      pivotX,
      pivotY,

      visualLength * 2,
      visualLength * 2,

      HALF_PI -
      radians(thetaMaxDeg),

      HALF_PI +
      radians(thetaMaxDeg)
    );

    pop();
  }


  // ==========================================================
  // GARIS KESEIMBANGAN
  // ==========================================================

  if (cbEquilibrium.checked()) {

    push();

    stroke(180);

    drawingContext.setLineDash(
      [6, 6]
    );

    line(
      pivotX,
      pivotY,

      pivotX,
      pivotY +
      visualLength +
      20
    );

    drawingContext.setLineDash(
      []
    );

    pop();
  }


  // ==========================================================
  // JEJAK
  // ==========================================================

  if (cbTrail.checked()) {

    for (
      let i = 0;
      i < trail.length;
      i++
    ) {

      let alpha =
        map(
          i,
          0,
          trail.length,
          20,
          130
        );

      noStroke();

      fill(
        60,
        130,
        210,
        alpha
      );

      circle(
        trail[i].x,
        trail[i].y,
        7
      );
    }
  }


  // ==========================================================
  // TITIK TUMPU
  // ==========================================================

  fill(40);

  noStroke();

  circle(
    pivotX,
    pivotY,
    16
  );


  // ==========================================================
  // TALI
  // ==========================================================

  stroke(50);

  strokeWeight(3);

  line(
    pivotX,
    pivotY,
    bobX,
    bobY
  );


  // ==========================================================
  // MASSA
  // ==========================================================

  let bobSize =
    map(
      m,
      0.1,
      5,
      30,
      58
    );


  fill(
    50,
    120,
    210
  );

  stroke(20);

  strokeWeight(2);

  circle(
    bobX,
    bobY,
    bobSize
  );


  // ==========================================================
  // SUDUT
  // ==========================================================

  if (cbAngle.checked()) {

    push();

    noFill();

    stroke(
      225,
      100,
      40
    );

    strokeWeight(2);

    arc(
      pivotX,
      pivotY,
      80,
      80,

      HALF_PI -
      max(theta, 0),

      HALF_PI -
      min(theta, 0)
    );


    noStroke();

    fill(
      180,
      70,
      30
    );

    textSize(14);

    text(
      "θ = " +
      nf(
        degrees(theta),
        1,
        1
      ) +
      "°",

      pivotX + 50,
      pivotY + 40
    );

    pop();
  }


  // ==========================================================
  // VEKTOR
  // ==========================================================

  if (cbVelocity.checked()) {

    drawVelocityVector();
  }


  if (cbAcceleration.checked()) {

    drawAccelerationVector();
  }


  // ==========================================================
  // LABEL POSISI
  // ==========================================================

  let leftX =
    pivotX -
    visualLength *
    sin(
      radians(thetaMaxDeg)
    );


  let rightX =
    pivotX +
    visualLength *
    sin(
      radians(thetaMaxDeg)
    );


  let extremeY =
    pivotY +
    visualLength *
    cos(
      radians(thetaMaxDeg)
    );


  fill(70);

  noStroke();

  textSize(13);

  textAlign(CENTER);


  text(
    "A\nEkstrem Kiri",
    leftX,
    extremeY + 35
  );


  text(
    "O\nKeseimbangan",
    pivotX,
    pivotY +
    visualLength +
    35
  );


  text(
    "B\nEkstrem Kanan",
    rightX,
    extremeY + 35
  );


  textAlign(LEFT);
}


// ============================================================
// 20. VEKTOR KECEPATAN
// ============================================================

function drawVelocityVector() {

  let magnitude =
    constrain(
      abs(velocity) * 80,
      0,
      110
    );


  if (magnitude < 2)
    return;


  let sign =
    velocity >= 0
      ? 1
      : -1;


  let tx =
    cos(theta) *
    sign;


  let ty =
    -sin(theta) *
    sign;


  drawArrow(
    bobX,
    bobY,

    bobX +
    tx * magnitude,

    bobY +
    ty * magnitude,

    "v",

    color(
      220,
      65,
      55
    )
  );
}


// ============================================================
// 21. VEKTOR PERCEPATAN
// ============================================================

function drawAccelerationVector() {

  let magnitude =
    constrain(
      abs(acceleration) * 10,
      0,
      90
    );


  if (magnitude < 2)
    return;


  let sign =
    acceleration >= 0
      ? 1
      : -1;


  let tx =
    cos(theta) *
    sign;


  let ty =
    -sin(theta) *
    sign;


  drawArrow(
    bobX,
    bobY,

    bobX +
    tx * magnitude,

    bobY +
    ty * magnitude,

    "a",

    color(
      235,
      145,
      30
    )
  );
}


// ============================================================
// 22. PANAH
// ============================================================

function drawArrow(
  x1,
  y1,
  x2,
  y2,
  label,
  c
) {

  push();

  stroke(c);

  fill(c);

  strokeWeight(3);

  line(
    x1,
    y1,
    x2,
    y2
  );


  let angle =
    atan2(
      y2 - y1,
      x2 - x1
    );


  translate(
    x2,
    y2
  );

  rotate(angle);


  triangle(
    0,
    0,
    -11,
    -6,
    -11,
    6
  );


  rotate(
    -angle
  );


  noStroke();

  textSize(15);

  textStyle(BOLD);

  text(
    label,
    8,
    -8
  );

  pop();
}

function updateHistory() {

  thetaHistory.push(
    degrees(theta)
  );


  ekHistory.push(Ek);

  epHistory.push(Ep);

  emHistory.push(Em);


  if (
    thetaHistory.length >
    300
  ) {

    thetaHistory.shift();

    ekHistory.shift();

    epHistory.shift();

    emHistory.shift();
  }


  if (
    frameCount % 4 === 0
  ) {

    trail.push({
      x: bobX,
      y: bobY
    });


    if (
      trail.length >
      35
    ) {

      trail.shift();
    }
  }
}

// ============================================================
// 31. GARIS GRAFIK ENERGI
// ============================================================

function drawEnergyGraphLine(
  arr,
  x,
  y,
  w,
  h,
  c
) {

  if (
    arr.length < 2
  )
    return;


  let maxVal =
    max(emHistory);


  if (
    !maxVal ||
    maxVal <= 0
  )
    maxVal = 1;


  noFill();

  stroke(c);

  strokeWeight(2.5);

  beginShape();


  for (
    let i = 0;
    i < arr.length;
    i++
  ) {

    let px =
      map(
        i,
        0,
        300,

        x + 20,
        x + w - 20
      );


    let py =
      map(
        arr[i],
        0,
        maxVal,

        y + h - 15,
        y + 50
      );


    vertex(
      px,
      py
    );
  }


  endShape();
}

function mousePressed() {

  let d =
    dist(
      mouseX,
      mouseY,
      bobX,
      bobY
    );


  if (d < 45) {

    dragging = true;

    simRunning = false;
  }

// ============================================================
// 39. DRAG BANDUL
// ============================================================

function mouseDragged() {

  if (!dragging)
    return;


  let dx =
    mouseX -
    pivotX;


  let dy =
    mouseY -
    pivotY;


  let newTheta =
    atan2(
      dx,
      dy
    );


  newTheta =
    constrain(
      newTheta,
      radians(-45),
      radians(45)
    );


  thetaMaxDeg =
    max(
      2,
      abs(
        degrees(newTheta)
      )
    );


  angleSlider.value(
    thetaMaxDeg
  );


  angleInput.value(
    nf(
      thetaMaxDeg,
      1,
      1
    )
  );


  simTime = 0;

  clearGraphHistory();

  updateParameters();


  if (
    newTheta < 0
  ) {

    theta =
      -radians(
        thetaMaxDeg
      );

  } else {

    theta =
      radians(
        thetaMaxDeg
      );
  }


  let visualLength =
    map(
      L,
      0.2,
      3,
      120,
      330
    );


  bobX =
    pivotX +
    visualLength *
    sin(theta);


  bobY =
    pivotY +
    visualLength *
    cos(theta);
}

// ============================================================

  if (dragging) {

    dragging = false;

    simTime = 0;

    updatePhysics();
  }
}

  function pendCorrection(){
    // K(sin(theta0/2)) lengkap dengan arithmetic-geometric mean.
    const kk=Math.sin(p.angle*Math.PI/360);let a=1,b=Math.sqrt(1-kk*kk);
    for(let i=0;i<12;i++){const next=(a+b)/2;b=Math.sqrt(a*b);a=next;if(Math.abs(a-b)<1e-13)break;}
    return 1/a;
  }
  function Tpend(){return periodPendApprox()*pendCorrection();}
  function Tspring(){return 2*Math.PI*Math.sqrt(p.ms/p.k);}
  function TeffectiveSpring(){return 2*Math.PI/Math.sqrt(p.k/p.ms-p.bs*p.bs);}
  function eqStretch(){return p.ms*p.g/p.k;}
  function baseP(){return {x:230,y:174};}
  function baseS(){return {x:614,y:174};}
  function pendVisualLen(){return 142+(p.L-.4)/(2.5-.4)*112;}
  function scaleSpring(){return Math.min(230,78/Math.max(.01,eqStretch()),80/Math.max(.02,p.A));}
  function springNatural(){return 317;}
  function springEqY(){return springNatural()+eqStretch()*scaleSpring();}
  function bobP(){const o=baseP(),len=pendVisualLen();return {x:o.x+len*Math.sin(positionP),y:o.y+len*Math.cos(positionP)};}
  function bobS(){return {x:614,y:springEqY()+positionS*scaleSpring()};}

  // RK4: kedua sistem diintegrasi independen dengan langkah waktu yang sama.
  function derivatives(st){
    const [th,thv,xx,xv]=st;
    return [thv,-p.g/p.L*Math.sin(th)-2*p.bp*thv,xv,-p.k/p.ms*xx-2*p.bs*xv];
  }
  function integrate(dt){
    const y=[positionP,velocityP,positionS,velocityS];
    const a1=derivatives(y);
    const a2=derivatives(y.map((val,i)=>val+.5*dt*a1[i]));
    const a3=derivatives(y.map((val,i)=>val+.5*dt*a2[i]));
    const a4=derivatives(y.map((val,i)=>val+dt*a3[i]));
    positionP+=dt*(a1[0]+2*a2[0]+2*a3[0]+a4[0])/6;
    velocityP+=dt*(a1[1]+2*a2[1]+2*a3[1]+a4[1])/6;
    positionS+=dt*(a1[2]+2*a2[2]+2*a3[2]+a4[2])/6;
    velocityS+=dt*(a1[3]+2*a2[3]+2*a3[3]+a4[3])/6;
    t+=dt;
  }
  function energies(){
    const ekp=.5*p.mp*p.L*p.L*velocityP*velocityP;
    const epp=p.mp*p.g*p.L*(1-Math.cos(positionP));
    const eks=.5*p.ms*velocityS*velocityS;
    const eps=.5*p.k*positionS*positionS;
    return {ekp,epp,emp:ekp+epp,eks,eps,ems:eks+eps};
  }
  function physics(){
    const E=energies();
    const pp=-p.g/p.L*Math.sin(positionP)-2*p.bp*velocityP;
    const as=-p.k/p.ms*positionS-2*p.bs*velocityS;
    const fsp=-p.k*(eqStretch()+positionS);
    const mg=p.ms*p.g,fd=-2*p.ms*p.bs*velocityS;
    return {...E,app:pp,as,fs:fsp,mg,fd,fnet:mg+fsp+fd,
      tp:Tpend(),tp0:periodPendApprox(),ts:Tspring(),tsd:TeffectiveSpring(),ext:eqStretch(),
      ep0:p.mp*p.g*p.L*(1-Math.cos(p.angle*Math.PI/180)),
      es0:.5*p.k*p.A*p.A};
  }
  function appendSample(force=false){
    if(!force && t-lastSample<.025)return;
    const z=physics();samples.push({t,qP:positionP/(p.angle*Math.PI/180),qS:positionS/p.A,
      xP:positionP,xS:positionS,ekp:z.ekp,epp:z.epp,emp:z.emp,eks:z.eks,eps:z.eps,ems:z.ems});
    if(samples.length>1000)samples.shift();lastSample=t;
    if(flags.trail){traceP.push({...bobP(),t});traceS.push({...bobS(),t});
      if(traceP.length>100)traceP.shift();if(traceS.length>100)traceS.shift();}
  }
  function resetMotion(clearAll=false){
    running=false;t=0;positionP=signP*p.angle*Math.PI/180;velocityP=0;
    positionS=signS*p.A;velocityS=0;samples=[];lastSample=-1;traceP=[];traceS=[];
    if(clearAll)records=[];appendSample(true);missionWon=false;
    evaluateMission();
  }
  function setParam(key,val,fromSlider=false){
    const def=P[key];const number=Number(val);
    if(!Number.isFinite(number))return;
    let v=bounded(number,def.min,def.max);
    if(fromSlider)v=Math.round(v/def.step)*def.step;
    p[key]=Number(v.toFixed(5));
    if(key==='g')selectedPlanet=-1;
    resetMotion();
  }

    p={...ORIGINAL};selectedPlanet=0;speedIndex=2;energyView='P';signP=1;signS=1;
    mission=false;missionWon=false;missionAwarded=false;missionScore=0;resetMotion(true);

  function start(){running=true;toast('Kedua osilator bergerak bersama dalam waktu simulasi yang sama.');}
  function pause(){running=false;toast('Kedua osilator dijeda.');}
  function stop(){resetMotion();toast('Waktu kembali ke nol; parameter dan data percobaan tetap.');}
  function step(){running=false;for(let i=0;i<10;i++)integrate(.005);appendSample(true);}
  function changePlanet(){selectedPlanet=(selectedPlanet+1)%PLANETS.length;p.g=PLANETS[selectedPlanet][1];resetMotion();
    toast('Planet: '+PLANETS[selectedPlanet][0]+'. Posisi pegas bergeser; periode pegas ideal tetap.');}
  function challenge(){
    mission=!mission;missionWon=false;missionAwarded=false;
    if(mission){p.bp=0;p.bs=0;resetMotion();toast('MISI AKTIF: Samakan periode bandul dan pegas. Redaman otomatis dinolkan.',5);}
    else toast('Misi periode dinonaktifkan.');
  }
  function autoMatch(){
    // Target periode pegas ideal setara periode bandul nonlinier.
    const targetK=4*Math.PI*Math.PI*p.ms/(Tpend()*Tpend());
    if(targetK<P.k.min||targetK>P.k.max){
      toast('Nilai k yang diperlukan di luar rentang. Ubah massa pegas atau panjang bandul.',6);return;
    }
    p.k=Number(targetK.toFixed(4));p.bp=0;p.bs=0;mission=true;missionAwarded=true;
    resetMotion();toast('MODE DEMO: k diatur sesuai persamaan kesetaraan periode (tanpa bonus).',5);
  }
  function evaluateMission(){
    if(!mission)return;
    const ratio=Math.abs(Tpend()-Tspring())/Tpend();
    if(ratio<=.03 && !missionWon){missionWon=true;
      if(!missionAwarded){missionScore+=100;missionAwarded=true;toast('MISI BERHASIL! Selisih periode ≤3%. Bonus 100 poin.',6);}}
  }

  function springCoil(x,y1,y2){

    line(x,y2-10,x,y2);stroke(136,198,238,145);strokeWeight(1.5);
    beginShape();for(let i=0;i<=steps;i++){const f=i/steps;vertex(x-2+22*Math.sin(f*coils*TWO_PI),y1+9+(h-19)*f);}endShape();pop();

  function teacherBandul(){
    const amplitude=p.angle*Math.PI/180;
    const nearExtreme=Math.abs(Math.abs(positionP)-amplitude)<Math.max(.015,amplitude*.09);
    const nearMiddle=Math.abs(positionP)<Math.max(.015,amplitude*.09);
    if(p.bp>0 && Math.abs(velocityP)>0.01)
      return 'Bandul teredam: energi mekanik menurun akibat hambatan. T sudut awal = '+fmt(Tpend(),2)+' s (acuan tanpa redaman).';
    if(nearExtreme)
      return 'Mendekati titik balik: kelajuan mengecil, Ep gravitasi mendominasi, dan Ek mendekati nol.';
    if(nearMiddle)
      return 'Melewati titik setimbang: kelajuan maksimum secara lokal, Ep minimum, dan Ek maksimum.';
    if(positionP*velocityP<0)
      return 'Berayun menuju keseimbangan: Ep berubah menjadi Ek; gaya pemulih tangensial menuju O.';
    return 'Berayun menuju posisi ekstrem: Ek berubah menjadi Ep; kelajuan semakin kecil.';
  }
  function teacherPegas(){

wer":"SINUSOIDAL","clue":"Bentuk grafik simpangan terhadap waktu pada GHS disebut kurva ....","hint":"Berbentuk gelombang sinus atau kosinus.","explain":"Untuk GHS ideal, x(t)=A cos(ωt+φ₀), sehingga grafiknya sinusoidal.","dir":"D","r":4,"c":14,"sourceNo":10,"number":7}]},{"tier":"MOTS","title":"THE ANALYST","subtitle":"Hubungan Rumus • Perhitungan • Energi","color":"#DB9A3E","points":150,"hints":6,"width":17,"height":18,"entries":[{"answer":"DUA","clue":"Sebuah bandul melakukan 12 getaran dalam 24 detik. Besar periodenya dalam detik adalah ....","hint":"Gunakan T=t/n.","explain":"Periode adalah 24/12=2 sekon, karena T=t/n.","dir":"A","r":14,"c":13,"sourceNo":1,"number":18},{"answer":"LIMA","clue":"Dalam waktu 7 detik, bandul melakukan 35 getaran. Besar frekuensinya dalam hertz adalah ....","hint":"Gunakan f=n/t.","explain":"Frekuensi f=35/7=5 Hz.","dir":"A","r":11,"c":9,"sourceNo":2,"number":15},{"answer":"SETENGAH","clue":"Bandul memiliki periode 2 detik. Frekuensinya dalam satuan hertz adalah ....","hint":"Gunakan hubungan f=1/T.","explain":"Frekuensi f=1/2=0,5 Hz, yang sama dengan setengah hertz.","dir":"A","r":5,"c":9,"sourceNo":3,"number":6},{"answer":"EMPAT","clue":"Agar periode bandul menjadi dua kali semula pada lokasi yang sama, panjang tali harus diperbesar sebanyak .... kali.","hint":"Gunakan T∝√L; kuadratkan faktor perubahan periode.","explain":"Jika periode menjadi 2T, panjang harus menjadi 2²L=4L.","dir":"A","r":7,"c":12,"sourceNo":4,"number":9},{"answer":"TETAP","clue":"Jika massa bandul diperbesar dua kali, sedangkan panjang tali dan gravitasi tidak berubah, periode bandul akan ....","hint":"Lihat variabel dalam T=2π√(L/g).","explain":"Pada sudut kecil, periode bandul tidak bergantung pada massa, jadi nilainya tetap.","dir":"A","r":9,"c":9,"sourceNo":5,"number":11},{"answer":"MEMENDEK","clue":"Bandul yang panjang talinya tetap dipindahkan ke lokasi dengan gravitasi lebih besar. Periode getarannya akan ....","hint":"Gunakan T∝1/√g.","explain":"Ketika g membesar, T=2π√(L/g) mengecil; periode memendek.","dir":"A","r":7,"c":0,"sourceNo":6,"number":8},{"answer":"MENURUN","clue":"Bandul dengan tali lebih panjang mempunyai frekuensi lebih kecil. Artinya, frekuensi getarannya ....","hint":"Gunakan f=1/T dan T∝√L.","explain":"Semakin panjang tali, periode bertambah dan frekuensi f=1/T menurun.","dir":"A","r":11,"c":1,"sourceNo":7,"number":13},{"answer":"KINETIK","clue":"Ketika bandul melewati titik terendah, energi yang mencapai nilai maksimum adalah energi ....","hint":"Kelajuan terbesar terjadi di titik keseimbangan.","explain":"Di titik terendah, kelajuan maksimum sehingga energi kinetik Ek=½mv² maksimum.","dir":"A","r":14,"c":4,"sourceNo":8,"number":17},{"answer":"POTENSIAL","clue":"Ketika bandul mencapai simpangan terjauh, energi yang mencapai nilai maksimum adalah energi ....","hint":"Ketinggian bandul terbesar di ujung ayunan.","explain":"Pada titik balik, ketinggian terhadap posisi terendah maksimum; energi potensial gravitasi paling besar.","dir":"A","r":16,"c":8,"sourceNo":9,"number":19},{"answer":"NOL","clue":"Bandul sesaat berhenti ketika mencapai simpangan terjauh. Besar kecepatannya pada saat tersebut adalah ....","hint":"Cermati keadaan saat benda berbalik arah.","explain":"Pada simpangan ekstrem, kecepatan sesaat v=0 sebelum bandul berbalik arah.","dir":"A","r":17,"c":2,"sourceNo":10,"number":20},{"answer":"AKAR","clue":"Pada persamaan T=2π√(L/g), periode berbanding lurus dengan .... kuadrat panjang tali.","hint":"Perhatikan simbol √ pada rumus.","explain":"Periode berbanding lurus dengan akar kuadrat panjang tali: T∝√L.","dir":"D","r":5,"c":15,"sourceNo":1,"number":7},{"answer":"PEMULIH","clue":"Ketika bandul menyimpang dari posisi terendah, komponen gaya berat yang mengarahkannya kembali ke keseimbangan disebut gaya ....","hint":"Arah gaya ini melawan simpangan.","explain":"Komponen tangensial gaya berat F=−mg sinθ adalah gaya pemulih bandul.","dir":"D","r":11,"c":14,"sourceNo":2,"number":16},{"answer":"MAKSIMUM","clue":"Pada bandul sudut kecil, besar gaya pemulih tangensial mencapai nilai .... ketika simpangan mencapai nilai terjauh.","hint":"F tangensial berbanding lurus dengan sin|θ| pada rentang sudut kecil.","explain":"|F_pemulih|=mg|sinθ| maksimum ketika |θ| mencapai simpangan sudut maksimum.","dir":"D","r":0,"c":2,"sourceNo":3,"number":1},{"answer":"TEGANGAN","clue":"Saat bandul melewati titik terendah dengan kecepatan tidak nol, gaya yang besarnya melebihi berat bandul adalah gaya .... tali.","hint":"Di titik bawah, gaya radial resultan menuju titik gantung.","explain":"Tegangan tali memenuhi T_tali=mg+mv²/L, sehingga lebih besar dari mg untuk v≠0.","dir":"D","r":10,"c":2,"sourceNo":4,"number":12},{"answer":"RADIAN","clue":"Dalam pendekatan sinθ≈θ, sudut θ harus dinyatakan dalam satuan ....","hint":"Satuan sudut yang dipakai secara alami dalam kalkulus.","explain":"Pendekatan sinθ≈θ berlaku untuk θ kecil dalam radian, bukan derajat.","dir":"D","r":11,"c":5,"sourceNo":5,"number":14},{"answer":"BERKURANG","clue":"Ketika bandul bergerak dari titik terendah menuju simpangan maksimum, energi kinetiknya semakin ....","hint":"Selama bandul naik, kelajuannya mengecil.","explain":"Selama naik, bandul melambat; Ek=½mv² berkurang dan berubah menjadi Ep.","dir":"D","r":4,"c":7,"sourceNo":6,"number":4},{"answer":"MENINGKAT","clue":"Jika panjang tali dipendekkan sementara gravitasi tetap, frekuensi getaran bandul akan ....","hint":"Gunakan f=(1/2π)√(g/L).","explain":"Ketika L mengecil, f=(1/2π)√(g/L) meningkat.","dir":"D","r":8,"c":10,"sourceNo":7,"number":10},{"answer":"KEKEKALAN","clue":"Pada bandul ideal tanpa gesekan, jumlah energi kinetik dan potensial tetap. Prinsip ini disebut hukum .... energi.","hint":"Energi mekanik tidak hilang pada sistem ideal.","explain":"Hukum kekekalan energi mekanik menyatakan Ek+Ep tetap jika tidak ada gaya nonkonservatif.","dir":"D","r":4,"c":12,"sourceNo":8,"number":5},{"answer":"REDAMAN","clue":"Amplitudo bandul nyata semakin kecil karena adanya hambatan udara. Peristiwa ini disebut ....","hint":"Gesekan menyebabkan amplitudo menyusut.","explain":"Redaman menyebabkan hilangnya energi mekanik dan amplitudo berangsur berkurang.","dir":"D","r":3,"c":0,"sourceNo":9,"number":3},{"answer":"RESONANSI","clue":"Bandul diberi dorongan berkala mendekati frekuensi alaminya hingga amplitudo membesar. Peristiwa ini disebut ....","hint":"Terjadi ketika frekuensi pemaksa mendekati frekuensi alami.","explain":"Resonansi terjadi saat eksitasi periodik mendekati frekuensi alami sistem, yang dapat meningkatkan amplitudo.","dir":"D","r":1,"c":4,"sourceNo":10,"number":2}]},{"tier":"HOTS","title":"THE MASTER","subtitle":"Analisis • Evaluasi • Inkuiri Ilmiah","color":"#9567C8","points":200,"hints":4,"width":18,"height":17,"entries":[{"answer":"SETENGAH","clue":"Dua bandul di lokasi sama: L_A=1 m dan L_B=4 m. Perbandingan periode A terhadap B adalah ....","hint":"Perhatikan T_A/T_B=√(L_A/L_B).","explain":"T_A/T_B=√(1/4)=1/2 sehingga periode A adalah setengah periode B.","dir":"A","r":15,"c":3,"sourceNo":1,"number":20},{"answer":"SAMA","clue":"Bandul dipindahkan ke planet dengan g sembilan kali lebih besar dan panjang tali juga dibuat sembilan kali lebih panjang. Periodenya menjadi ....","hint":"Gunakan rasio T∝√(L/g).","explain":"Karena L dan g keduanya 9 kali, rasio L/g tidak berubah; periode tetap sama.","dir":"A","r":10,"c":5,"sourceNo":2,"number":16},{"answer":"DUA","clue":"Panjang dua bandul sama, tetapi gravitasi di B empat kali gravitasi di A. Frekuensi B menjadi .... kali frekuensi A.","hint":"Frekuensi bandul berbanding lurus dengan √g.","explain":"f_B/f_A=√(g_B/g_A)=√4=2.","dir":"A","r":5,"c":5,"sourceNo":3,"number":11},{"answer":"EMPAT","clue":"Panjang tali bandul diperbesar 64 kali, sedangkan gravitasi diperbesar 4 kali. Periode baru menjadi .... kali semula.","hint":"Gunakan rasio periode √[(L₂/L₁)(g₁/g₂)].","explain":"T₂/T₁=√(64/4)=√16=4.","dir":"A","r":4,"c":0,"sourceNo":4,"number":8},{"answer":"SEPEREMPAT","clue":"Panjang tali diperkecil menjadi seperempat panjang semula dan gravitasi diperbesar 4 kali. Periode baru menjadi .... periode awal.","hint":"Gunakan T₂/T₁=√[(1/4)/4].","explain":"T₂/T₁=√(1/16)=1/4, yaitu seperempat periode awal.","dir":"A","r":7,"c":2,"sourceNo":5,"number":12},{"answer":"MENINGKAT","clue":"Bandul dibawa dari Bumi ke planet dengan gravitasi lebih kecil. Jika L dan sudut awal kecil tetap, periode ayunannya akan ....","hint":"Periode berbanding terbalik dengan akar gravitasi.","explain":"g yang lebih kecil membuat T=2π√(L/g) meningkat.","dir":"A","r":4,"c":9,"sourceNo":6,"number":10},{"answer":"MAKSIMUM","clue":"Bandul ideal bergerak dari simpangan ekstrem menuju titik terendah. Tepat di titik terendah, kecepatannya mencapai nilai ....","hint":"Energi potensial beralih menjadi energi kinetik.","explain":"Di titik paling rendah, energi potensial minimum dan energi kinetik maksimum; kelajuan juga maksimum.","dir":"A","r":0,"c":6,"sourceNo":7,"number":1},{"answer":"NOL","clue":"Saat bandul melewati titik keseimbangan, kecepatannya terbesar, tetapi percepatan tangensial dari gaya pemulih bernilai ....","hint":"Gunakan a_t=−g sinθ pada θ=0.","explain":"Di titik keseimbangan θ=0, percepatan tangensial a_t=0. Percepatan radial masih dapat ada.","dir":"A","r":11,"c":11,"sourceNo":8,"number":18},{"answer":"NEGATIF","clue":"Dalam GHS, sumbu positif ke kanan. Jika benda menyimpang ke kanan, tanda percepatan tangensialnya adalah ....","hint":"Gunakan a=−ω²x dan x>0.","explain":"Jika simpangan positif x>0, gaya pemulih dan percepatan a=−ω²x bernilai negatif.","dir":"A","r":2,"c":3,"sourceNo":9,"number":6},{"answer":"MEMANJANG","clue":"Bandul ideal berayun dengan sudut awal sangat besar. Dibanding rumus periode sudut kecil, periode sebenarnya cenderung ....","hint":"Pendekatan sinθ≈θ kurang akurat pada sudut besar.","explain":"Pada sudut awal besar, periode nyata bandul lebih panjang daripada T≈2π√(L/g).","dir":"A","r":12,"c":3,"sourceNo":10,"number":19},{"answer":"KONTROL","clue":"Siswa meneliti pengaruh panjang tali pada periode. Massa, lokasi dan sudut awal dijaga tetap. Variabel yang dijaga adalah variabel ....","hint":"Ingat desain percobaan satu variabel bebas.","explain":"Variabel kontrol dijaga konstan agar perubahan periode dapat dikaitkan dengan panjang tali.","dir":"D","r":1,"c":17,"sourceNo":1,"number":5},{"answer":"RADIAL","clue":"Bandul di titik terendah mempunyai percepatan tangensial nol, tetapi ada percepatan menuju titik gantung. Percepatan ini disebut ....","hint":"Arah percepatan menuju pusat lintasan lingkaran.","explain":"Percepatan radial atau sentripetal a_r=v²/L mengarah menuju titik gantung.","dir":"D","r":11,"c":9,"sourceNo":2,"number":17},{"answer":"TEGANGAN","clue":"Bandul melewati titik terendah dengan v≠0. Gaya .... tali harus lebih besar daripada berat karena diperlukan resultan ke pusat.","hint":"Di titik bawah: T_tali−mg=mv²/L.","explain":"Karena T_tali=mg+mv²/L, tegangan tali melebihi gaya berat saat v≠0.","dir":"D","r":7,"c":11,"sourceNo":3,"number":14},{"answer":"MEKANIK","clue":"Bandul ideal tanpa gesekan memiliki Ek dan Ep yang berganti, tetapi energi .... total tetap.","hint":"Jumlah Ek+Ep untuk sistem ideal.","explain":"Energi mekanik Em=Ek+Ep adalah konstan tanpa gaya disipatif.","dir":"D","r":0,"c":13,"sourceNo":4,"number":3},{"answer":"BERKURANG","clue":"Bandul nyata mengalami hambatan udara; sebagian energi menjadi kalor. Energi mekaniknya semakin ....","hint":"Gesekan mendisipasikan energi mekanik.","explain":"Hambatan udara mengubah sebagian energi mekanik menjadi energi internal dan kalor sehingga Em berkurang.","dir":"D","r":1,"c":15,"sourceNo":5,"number":4},{"answer":"REDAMAN","clue":"Dua bandul identik dengan sudut awal sama: A hampir hampa, B di udara. Amplitudo B lebih cepat menyusut karena mengalami ....","hint":"Hambatan udara mengurangi energi osilasi.","explain":"Redaman akibat hambatan udara menyebabkan amplitudo bandul B turun lebih cepat.","dir":"D","r":7,"c":6,"sourceNo":6,"number":13},{"answer":"RESONANSI","clue":"Siswa mendorong ayunan dengan frekuensi seperti frekuensi alaminya hingga amplitudo membesar. Peristiwanya ....","hint":"Dorongan ritmis mendekati frekuensi alami.","explain":"Resonansi memperbesar respons sistem karena transfer energi efektif ketika frekuensi pemaksa mendekati frekuensi alami.","dir":"D","r":3,"c":0,"sourceNo":7,"number":7},{"answer":"ANTIFASE","clue":"Dalam GHS, percepatan selalu berlawanan arah dengan simpangan. Hubungan fase kedua besaran disebut ....","hint":"Perbedaan fase 180° atau π radian.","explain":"Karena a=−ω²x, percepatan dan simpangan berselisih fase π radian atau antifase.","dir":"D","r":0,"c":7,"sourceNo":8,"number":2},{"answer":"NONLINEAR","clue":"Pada bandul dengan sudut sangat besar, sinθ≈θ tidak akurat. Persamaan geraknya bersifat ....","hint":"Persamaan gerak menggunakan sinθ, bukan hanya θ.","explain":"Untuk sudut besar, persamaan θ¨+(g/L)sinθ=0 bersifat nonlinear.","dir":"D","r":8,"c":13,"sourceNo":9,"number":15},{"answer":"PRESISI","clue":"Siswa mengulang pengukuran 20 ayunan dan menghitung rata-ratanya untuk mengurangi dampak galat acak. Aspek mutu pengukuran yang diperbaiki adalah ....","hint":"Berkaitan dengan konsistensi hasil berulang, bukan kedekatan ke nilai benar.","explain":"Pengulangan membantu meningkatkan ketelitian estimasi dan mengurangi efek galat acak; ini mendukung presisi pengukuran.","dir":"D","r":4,"c":2,"sourceNo":10,"number":9}]}];

      for(const [j,e] of L.entries.entries()){
        if(!/^[A-Z]+$/.test(e.answer)||!e.clue||!e.hint||!e.explain)throw Error('Data soal tidak lengkap '+L.tier+'/'+j);
        const dr=e.dir==='D'?1:0,dc=e.dir==='A'?1:0;

          cells[k]=e.answer[i];(ownership[k]??=[]).push(j);
        }
      }
      const adjacency=L.entries.map(()=>new Set());
      Object.values(ownership).forEach(owners=>{owners.forEach(i=>owners.forEach(j=>{if(i!==j)adjacency[i].add(j);}));});

 const QUESTIONS=[{"q":"Seorang siswa mengamati sebuah bandul yang bergerak bolak-balik secara teratur. Waktu yang diperlukan bandul untuk melakukan satu getaran penuh disebut ....","o":["Amplitudo","Periode","Frekuensi","Fase"],"a":1,"topic":"Getaran","hint":"Bedakan waktu satu siklus dengan jumlah siklus tiap detik.","formula":"T = t/n = 1/f","why":"Periode (T) menyatakan waktu untuk satu getaran penuh. Jika n getaran berlangsung selama t sekon, maka T = t/n. Satuan SI periode adalah sekon (s).","wrong":["Amplitudo adalah simpangan maksimum, bukan waktu satu siklus.","","Frekuensi menyatakan banyak getaran per sekon, bukan waktu satu getaran.","Fase menyatakan keadaan atau posisi dalam siklus, bukan durasi satu siklus."],"id":"M01","level":0,"index":0},{"q":"Sebuah pegas bergetar sebanyak 10 kali setiap detik. Besaran yang menyatakan banyaknya getaran per detik tersebut adalah ....","o":["Simpangan","Periode","Frekuensi","Amplitudo"],"a":2,"topic":"Getaran","hint":"Besaran ini diukur dalam hertz (Hz).","formula":"f = n/t, satuan Hz = s⁻¹","why":"Frekuensi adalah banyaknya getaran dalam satu sekon. Jika terjadi 10 getaran per detik, frekuensinya 10 Hz.","wrong":["Simpangan menyatakan posisi relatif dari titik keseimbangan.","Periode menyatakan waktu tiap getaran; di sini periode justru 0,1 s.","","Amplitudo menyatakan simpangan terjauh."],"id":"M02","level":0,"index":1},{"q":"Sebuah bandul memiliki simpangan maksimum 8 cm dari titik keseimbangannya. Besar amplitudo bandul tersebut adalah ....","o":["4 cm","8 cm","16 cm","32 cm"],"a":1,"topic":"GHS","hint":"Amplitudo diukur dari titik tengah ke satu posisi ekstrem.","formula":"A = |x|maks","why":"Amplitudo adalah nilai maksimum simpangan dari titik keseimbangan. Karena ekstremnya 8 cm, A = 8 cm; jarak dari ujung kiri ke kanan adalah 16 cm.","wrong":["4 cm hanya setengah amplitudo yang diberikan.","","16 cm adalah jarak antara dua posisi ekstrem (2A).","32 cm adalah empat kali simpangan maksimum yang diberikan."],"id":"M03","level":0,"index":2},{"q":"Sebuah pegas memiliki konstanta elastisitas k. Dalam Sistem Internasional (SI), satuan konstanta pegas adalah ....","o":["Kilogram (kg)","Newton (N)","Newton per meter (N/m)","Meter per sekon kuadrat (m/s²)"],"a":2,"topic":"Pegas","hint":"Perhatikan satuan gaya dibagi pertambahan panjang.","formula":"F = kx → k = F/x","why":"Konstanta pegas k menyatakan gaya tiap satuan pemanjangan. Karena k = F/x, satuannya N/m.","wrong":["Kilogram adalah satuan massa, bukan konstanta pegas.","Newton adalah satuan gaya, belum dibagi pertambahan panjang.","","m/s² adalah satuan percepatan."],"id":"M04","level":0,"index":3},{"q":"Ketika sebuah bandul disimpangkan dari titik terendahnya, terdapat komponen gaya berat yang berusaha mengembalikannya menuju titik keseimbangan. Komponen gaya ini disebut gaya ....","o":["Sentripetal","Pemulih","Gesek","Normal"],"a":1,"topic":"Bandul","hint":"Komponen tangensial yang mengarah ke posisi setimbang.","formula":"Fₜ = −mg sin θ","why":"Komponen tangensial gaya berat −mg sin θ bertindak sebagai gaya pemulih dan mengarahkan bandul menuju titik keseimbangan.","wrong":["Gaya sentripetal adalah resultan radial menuju pusat lintasan, bukan sebutan khusus komponen pemulih tangensial.","","Gaya gesek justru meredam gerakan bandul.","Gaya normal merupakan gaya kontak dari suatu permukaan, bukan komponen berat pada bandul."],"id":"M05","level":0,"index":4},{"q":"Pada sistem pegas yang melakukan gerak harmonik sederhana, kecepatan benda mencapai nilai maksimum ketika benda berada di ....","o":["Titik simpangan maksimum","Titik keseimbangan","Posisi tertinggi saja","Semua posisi dengan nilai sama"],"a":1,"topic":"Energi","hint":"Energi kinetik paling besar saat energi potensial efektif minimum.","formula":"v² = ω²(A² − x²)","why":"Di posisi keseimbangan x = 0, gaya pemulih sesaat nol dan energi potensial efektif minimum; energi kinetik dan besar kecepatan menjadi maksimum.","wrong":["Pada simpangan maksimum, benda sesaat berhenti sehingga v = 0.","","Kecepatan maksimum terjadi saat x = 0, bukan ditentukan hanya oleh posisi tertinggi.","Kecepatan berubah menurut posisi benda dalam GHS."],"id":"M06","level":0,"index":5},{"q":"Sebuah bandul mencapai simpangan maksimum pada salah satu ujung lintasannya. Pada saat itu besar kecepatan sesaat bandul adalah ....","o":["Maksimum","Selalu positif","Nol","Sama dengan percepatan gravitasi"],"a":2,"topic":"Bandul","hint":"Benda sesaat berhenti sebelum berbalik arah.","formula":"Di titik ekstrem: v = 0","why":"Di posisi ekstrem, bandul berubah arah. Pada titik balik kecepatannya sesaat nol, sebelum bergerak kembali ke keseimbangan.","wrong":["Kecepatan maksimum terjadi di titik keseimbangan.","Arah kecepatan berubah; pada titik balik besarnya justru nol.","","Kecepatan bersatuan m/s dan g bersatuan m/s², sehingga tidak dapat disamakan."],"id":"M07","level":0,"index":6},{"q":"Sebuah benda bermassa m bergerak dengan kecepatan v. Persamaan energi kinetik translasi benda tersebut adalah ....","o":["Ek = ½mv²","Ek = mgh","Ek = ½kx²","Ek = mv"],"a":0,"topic":"Energi","hint":"Energi gerak bergantung pada massa dan kuadrat kelajuan.","formula":"Ek = ½mv²","why":"Energi kinetik translasi adalah Ek = ½mv², dengan m dalam kg dan v dalam m/s. Hasilnya dalam joule (J).","wrong":["","mgh menyatakan energi potensial gravitasi.","½kx² menyatakan energi potensial elastis pegas.","mv menyatakan besar momentum, bukan energi kinetik."],"id":"M08","level":0,"index":7},{"q":"Ketika bandul berada pada posisi tertinggi dibandingkan titik terendah lintasannya, energi yang mencapai nilai maksimum adalah energi ....","o":["Kinetik","Potensial gravitasi","Listrik","Bunyi"],"a":1,"topic":"Energi","hint":"Ketinggian relatif paling besar pada posisi ekstrem.","formula":"Ep = mgh","why":"Energi potensial gravitasi bergantung pada ketinggian h. Pada posisi tertinggi, h maksimum sehingga Ep = mgh maksimum.","wrong":["Di titik tertinggi laju nol sehingga energi kinetik minimum.","","Energi listrik bukan energi utama yang diperbandingkan pada bandul mekanis.","Energi bunyi bukan bentuk energi utama dalam model bandul ideal."],"id":"M09","level":0,"index":8},{"q":"Getaran dan gelombang memiliki hubungan erat. Perbedaan mendasar antara keduanya adalah bahwa gelombang merupakan ....","o":["Gerak bolak-balik satu benda tanpa perambatan","Gangguan yang merambat dan membawa energi","Perpindahan seluruh partikel medium secara permanen","Gerakan yang tidak memiliki frekuensi"],"a":1,"topic":"Gelombang","hint":"Bandingkan gangguan yang menjalar pada tali dengan osilasi di satu titik.","formula":"Gelombang merambat; v = fλ","why":"Gelombang adalah gangguan yang merambat dan membawa energi. Pada gelombang mekanik, partikel medium berosilasi di sekitar keseimbangannya dan tidak berpindah permanen bersama gelombang.","wrong":["Ini lebih menggambarkan getaran lokal daripada gelombang yang merambat.","","Medium dapat berosilasi tanpa berpindah secara permanen bersama gelombang.","Gelombang periodik memiliki frekuensi."],"id":"M10","level":0,"index":9},{"q":"Dalam percobaan, sebuah bandul melakukan 18 getaran selama 9 detik. Frekuensi getaran bandul tersebut adalah ....","o":["1 Hz","2 Hz","3 Hz","9 Hz"],"a":1,"topic":"Getaran","hint":"Bagi jumlah getaran dengan waktu total.","formula":"f = n/t","why":"Diketahui n = 18 getaran dan t = 9 s. Maka f = n/t = 18/9 = 2 Hz.","wrong":["1 Hz berarti 9 getaran selama 9 s, bukan 18.","","3 Hz berarti 27 getaran selama 9 s.","9 Hz menyatakan 81 getaran selama 9 s."],"id":"M11","level":1,"index":0},{"q":"Sebuah pegas bergetar dengan periode 0,2 sekon. Frekuensi getarannya adalah ....","o":["0,2 Hz","2 Hz","5 Hz","10 Hz"],"a":2,"topic":"Getaran","hint":"Frekuensi adalah kebalikan periode.","formula":"f = 1/T","why":"T = 0,2 s, sehingga f = 1/0,2 = 5 Hz. Artinya terjadi 5 siklus tiap sekon.","wrong":["0,2 adalah nilai periode dalam sekon, bukan frekuensi.","2 Hz memiliki periode 0,5 s.","","10 Hz memiliki periode 0,1 s."],"id":"M12","level":1,"index":1},{"q":"Sebuah bandul matematis mempunyai panjang tali 1 m dan berayun dengan sudut kecil. Jika g = 10 m/s², periodenya mendekati ....","o":["0,5 s","1 s","2 s","4 s"],"a":2,"topic":"Bandul","hint":"Pakai persamaan periode bandul untuk sudut kecil.","formula":"T = 2π√(L/g)","why":"T = 2π√(1/10). Dengan π² ≈ 10, T = 2√(π²/10) ≈ 2 s.","wrong":["0,5 s terlalu kecil untuk kombinasi L dan g ini.","1 s setengah nilai hasil substitusi persamaan periode.","","4 s adalah dua kali nilai hasil perhitungan."],"id":"M13","level":1,"index":2},{"q":"Seorang siswa memperpanjang tali bandul menjadi sembilan kali panjang semula. Dengan gravitasi tetap dan sudut ayunan kecil, periode bandul menjadi ....","o":["Sepertiga kali semula","Tiga kali semula","Sembilan kali semula","Delapan puluh satu kali semula"],"a":1,"topic":"Bandul","hint":"Periode berbanding lurus dengan akar kuadrat panjang.","formula":"T₂/T₁ = √(L₂/L₁)","why":"Jika L₂ = 9L₁, maka T₂/T₁ = √9 = 3. Periode menjadi tiga kali semula.","wrong":["Sepertiga merupakan kebalikan perubahan yang benar.","","Sembilan kali salah karena lupa akar pada hubungan periode.","81 kali merupakan kuadrat perubahan panjang, bukan akar."],"id":"M14","level":1,"index":3},{"q":"Beban pada sebuah pegas diganti dari 1 kg menjadi 9 kg, sementara konstanta pegas tetap. Periode getarannya menjadi ....","o":["Tiga kali semula","Sembilan kali semula","Sepertiga kali semula","Tetap"],"a":0,"topic":"Pegas","hint":"Dalam pegas, periode berbanding lurus dengan akar massa.","formula":"T = 2π√(m/k)","why":"Karena massa dinaikkan 9 kali dan k tetap, T₂/T₁ = √(9/1) = 3. Periodenya tiga kali semula.","wrong":["","Sembilan kali salah karena periode sebanding dengan √m, bukan m.","Sepertiga kali adalah arah perubahan yang terbalik.","Massa memang memengaruhi periode pegas ideal."],"id":"M15","level":1,"index":4},{"q":"Sebuah pegas mempunyai konstanta 150 N/m dan ditarik sejauh 4 cm dari posisi keseimbangan. Besar gaya pemulihnya adalah ....","o":["3 N","6 N","12 N","60 N"],"a":1,"topic":"Pegas","hint":"Konversi 4 cm ke 0,04 m; gunakan hukum Hooke.","formula":"F = −kx; besar |F| = k|x|","why":"x = 4 cm = 0,04 m. Besar gaya |F| = k|x| = 150 × 0,04 = 6 N. Tanda minus pada rumus menunjukkan arah pemulih.","wrong":["3 N hanya setengah hasil perkalian yang benar.","","12 N dua kali hasil yang benar.","60 N berasal dari konversi panjang yang tidak tepat."],"id":"M16","level":1,"index":5},{"q":"Sebuah benda melakukan GHS dengan amplitudo 0,1 m dan frekuensi sudut 20 rad/s. Kecepatan maksimum benda adalah ....","o":["0,5 m/s","1 m/s","2 m/s","20 m/s"],"a":2,"topic":"GHS","hint":"Kecepatan maksimum adalah amplitudo dikali frekuensi sudut.","formula":"vmaks = ωA","why":"A = 0,1 m dan ω = 20 rad/s, sehingga vmaks = ωA = 20 × 0,1 = 2 m/s.","wrong":["0,5 m/s tidak sesuai perkalian ω dan A.","1 m/s hanya setengah hasil yang benar.","","20 m/s mengabaikan faktor amplitudo 0,1 m."],"id":"M17","level":1,"index":6},{"q":"Sebuah pegas dengan konstanta 200 N/m diregangkan sejauh 10 cm dari panjang keseimbangannya. Energi potensial elastis yang tersimpan adalah ....","o":["0,1 J","0,5 J","1 J","2 J"],"a":2,"topic":"Energi","hint":"Konversi 10 cm ke 0,1 m; gunakan kuadrat simpangan.","formula":"Ep = ½kx²","why":"x = 0,10 m. Maka Ep = ½ × 200 × (0,10)² = 100 × 0,01 = 1 J.","wrong":["0,1 J kurang sepuluh kali karena kesalahan pengkuadratan atau perkalian.","0,5 J hanya setengah nilai yang benar.","","2 J sering muncul jika lupa faktor ½."],"id":"M18","level":1,"index":7},{"q":"Energi mekanik total sebuah benda yang bergetar harmonik adalah 8 J. Pada suatu posisi, energi potensialnya 3 J. Energi kinetiknya adalah ....","o":["3 J","5 J","8 J","11 J"],"a":1,"topic":"Energi","hint":"Total energi adalah jumlah energi kinetik dan potensial.","formula":"Em = Ek + Ep","why":"Ek = Em − Ep = 8 J − 3 J = 5 J. Pada osilator ideal, energi berubah bentuk tetapi jumlahnya tetap.","wrong":["3 J adalah energi potensial yang diberikan.","","8 J adalah energi mekanik total, bukan hanya kinetik.","11 J salah karena energi potensial harus dikurangkan dari total."],"id":"M19","level":1,"index":8},{"q":"Sebuah gelombang merambat pada tali dengan frekuensi 4 Hz dan panjang gelombang 1,5 m. Cepat rambat gelombang adalah ....","o":["2,5 m/s","4 m/s","5,5 m/s","6 m/s"],"a":3,"topic":"Gelombang","hint":"Kecepatan gelombang adalah frekuensi kali panjang gelombang.","formula":"v = fλ","why":"v = 4 Hz × 1,5 m = 6 m/s. Frekuensi bersatuan s⁻¹ sehingga hasilnya m/s.","wrong":["2,5 m/s muncul jika besaran dijumlah atau dikurang tidak tepat.","4 m/s mengabaikan panjang gelombang.","5,5 m/s berasal dari penjumlahan f dan λ, bukan perkalian.",""],"id":"M20","level":1,"index":9},{"q":"Dua bandul A dan B berada di lokasi yang sama. Panjang tali A adalah 1 m, sedangkan panjang tali B adalah 4 m. Keduanya berayun dengan simpangan kecil. Perbandingan periode A terhadap periode B adalah ....","o":["1 : 4","1 : 2","2 : 1","4 : 1"],"a":1,"topic":"Bandul","hint":"Bandingkan akar panjang masing-masing bandul.","formula":"Tₐ/Tᵦ = √(Lₐ/Lᵦ)","why":"Tₐ/Tᵦ = √(1/4) = 1/2. Jadi perbandingan periode A : B adalah 1 : 2.","wrong":["1 : 4 adalah perbandingan panjang, bukan periode.","","2 : 1 membalik hubungan yang benar.","4 : 1 juga membalik dan mengabaikan akar kuadrat."],"id":"M21","level":2,"index":0},{"q":"Sebuah bandul dibawa dari Bumi ke planet dengan percepatan gravitasi seperempat gravitasi Bumi. Jika panjang tali tidak berubah, periode bandul akan ....","o":["Menjadi setengah","Tetap","Menjadi dua kali","Menjadi empat kali"],"a":2,"topic":"Bandul","hint":"Periode berbanding terbalik dengan akar gravitasi.","formula":"T₂/T₁ = √(g₁/g₂)","why":"Jika g₂ = g₁/4, maka T₂/T₁ = √4 = 2. Periode menjadi dua kali saat gravitasi lebih kecil.","wrong":["Periode justru membesar saat gravitasi mengecil.","Gravitasi termasuk faktor penentu periode bandul.","","Perubahan periode mengikuti akar perubahan gravitasi, bukan empat kali langsung."],"id":"M22","level":2,"index":1},{"q":"Sebuah sistem massa–pegas dimodifikasi dengan memperbesar massa beban menjadi empat kali semula dan konstanta pegas juga menjadi empat kali semula. Periode getaran sistem tersebut akan ....","o":["Tetap","Menjadi dua kali","Menjadi empat kali","Menjadi setengah"],"a":0,"topic":"Pegas","hint":"Perhatikan rasio m/k dalam akar.","formula":"T = 2π√(m/k)","why":"T₂/T₁ = √[(4m/4k)/(m/k)] = √1 = 1. Kedua perubahan saling mengimbangi sehingga periode tetap.","wrong":["","Dua kali terjadi jika rasio m/k bertambah empat kali, bukan tetap.","Empat kali tidak mengikuti akar rasio.","Setengah kali akan terjadi jika rasio m/k menjadi seperempat semula."],"id":"M23","level":2,"index":2},{"q":"Sebuah pegas bergetar tanpa gesekan dengan amplitudo A dan energi mekanik total E. Ketika simpangannya sebesar A/2, energi kinetiknya adalah ....","o":["¼ E","½ E","¾ E","E"],"a":2,"topic":"Energi","hint":"Energi potensial efektif sebanding dengan kuadrat simpangan.","formula":"Ep/E = (x/A)², Ek = E − Ep","why":"Saat x = A/2, Ep/E = (1/2)² = 1/4. Karena Ek + Ep = E, maka Ek = 3/4 E.","wrong":["¼ E adalah bagian energi potensial pada x = A/2.","½ E muncul bila memakai x/A tanpa dikuadratkan.","","Ek = E hanya ketika x = 0 (posisi setimbang)."],"id":"M24","level":2,"index":3},{"q":"Pada sistem pegas horizontal, benda berada di titik simpangan maksimum sebelah kanan dari posisi keseimbangan. Arah percepatan benda saat itu adalah ....","o":["Menjauhi titik keseimbangan","Menuju titik keseimbangan","Tidak memiliki percepatan","Selalu searah dengan kecepatan"],"a":1,"topic":"GHS","hint":"Percepatan selalu berlawanan arah dengan simpangan.","formula":"a = −ω²x","why":"Ketika x positif maksimum (di kanan), percepatan a = −ω²x bernilai negatif (ke kiri), yaitu menuju titik keseimbangan.","wrong":["Percepatan pemulih tidak menjauhi keseimbangan.","","Kecepatan nol di titik ekstrem, tetapi besar percepatannya justru maksimum.","Arah percepatan tidak selalu sama dengan arah kecepatan."],"id":"M25","level":2,"index":4},{"q":"Persamaan simpangan suatu benda yang bergerak harmonik adalah x = 0,1 cos(6πt), dengan x dalam meter dan t dalam sekon. Frekuensi getarannya adalah ....","o":["1 Hz","2 Hz","3 Hz","6 Hz"],"a":2,"topic":"GHS","hint":"Koefisien t di dalam cosinus adalah frekuensi sudut ω.","formula":"x = A cos(ωt + φ₀), ω = 2πf","why":"Dari x = 0,1 cos(6πt), diketahui ω = 6π rad/s. Maka f = ω/(2π) = 6π/(2π) = 3 Hz.","wrong":["1 Hz berarti ω = 2π rad/s.","2 Hz berarti ω = 4π rad/s.","","6 Hz salah karena 6π adalah ω, bukan f."],"id":"M26","level":2,"index":5},{"q":"Pada sebuah percobaan bandul nyata, siswa mencatat amplitudo puncak yang semakin mengecil, dari 8 cm menjadi 6 cm, kemudian 4 cm. Kesimpulan yang paling tepat adalah ....","o":["Energi mekanik bandul bertambah","Percepatan gravitasi semakin kecil","Massa bandul berkurang setiap getaran","Sebagian energi mekanik terdisipasi akibat gaya hambat"],"a":3,"topic":"Eksperimen","hint":"Amplitudo menyusut menandakan redaman dan kehilangan energi mekanik.","formula":"Redaman → amplitudo menurun; Em tidak konstan","why":"Hambatan udara dan gesekan mendisipasikan energi mekanik menjadi panas dan bentuk lain. Amplitudo puncak menurun, sehingga gerak bandul mengalami redaman.","wrong":["Amplitudo yang menyusut justru menunjukkan energi mekanik berkurang.","Tidak ada bukti bahwa gravitasi berubah selama ayunan.","Massa bandul tidak otomatis hilang karena berosilasi.",""],"id":"M27","level":2,"index":6},{"q":"Gelombang merambat dalam medium yang sama dengan cepat rambat tetap. Ketika frekuensi sumber dinaikkan menjadi tiga kali semula, panjang gelombangnya akan ....","o":["Menjadi tiga kali","Tetap","Menjadi sepertiga","Menjadi sembilan kali"],"a":2,"topic":"Gelombang","hint":"Ketika v tetap, λ berbanding terbalik dengan f.","formula":"λ = v/f","why":"Karena v tetap dan f₂ = 3f₁, maka λ₂ = v/(3f₁) = λ₁/3. Panjang gelombang menjadi sepertiga.","wrong":["Panjang gelombang berkurang ketika frekuensi naik pada v tetap.","λ tetap hanya bila f tetap dalam medium dengan v tetap.","","Sembilan kali tidak sesuai hubungan λ ∝ 1/f."],"id":"M28","level":2,"index":7},{"q":"Seorang siswa membuat grafik kuadrat periode T² terhadap panjang tali L pada percobaan bandul sederhana. Grafik menunjukkan gradien sebesar 8 s²/m. Percepatan gravitasi yang diperoleh mendekati ....","o":["2,5 m/s²","5 m/s²","10 m/s²","20 m/s²"],"a":1,"topic":"Eksperimen","hint":"Gradien grafik T² vs L adalah 4π²/g.","formula":"T² = (4π²/g)L → g = 4π²/gradien","why":"Gradien = 8 s²/m. Dengan π² ≈ 10, g = 4π²/8 ≈ 40/8 = 5 m/s². Nilai ini merupakan hasil eksperimen hipotetis.","wrong":["2,5 m/s² adalah setengah hasil yang benar.","","10 m/s² merupakan perkiraan gravitasi Bumi, tetapi tidak cocok dengan gradien 8.","20 m/s² diperoleh jika hubungan gradien dibalik atau konstanta salah."],"id":"M29","level":2,"index":8},{"q":"Seorang peneliti menggunakan rumus periode bandul sudut kecil untuk memprediksi ayunan dengan sudut awal sangat besar. Ketika diukur secara teliti, periode nyata ternyata berbeda. Pernyataan yang paling tepat adalah ....","o":["Rumus sudut kecil tetap menghasilkan nilai yang selalu persis benar","Massa bandul pasti berubah selama bergerak","Periode sebenarnya lebih panjang daripada prediksi pendekatan sudut kecil","Percepatan gravitasi pasti meningkat karena sudut awal diperbesar"],"a":2,"topic":"Eksperimen","hint":"Penyederhanaan sin θ ≈ θ hanya akurat pada sudut kecil (radian).","formula":"T ≈ 2π√(L/g) berlaku untuk θ kecil","why":"Untuk sudut awal besar, persamaan dinamika bandul tidak lagi linear dan periode eksaknya lebih besar daripada prediksi T ≈ 2π√(L/g). Perubahan terjadi karena batas pendekatan, bukan perubahan massa atau gravitasi.","wrong":["Rumus tersebut adalah pendekatan sudut kecil, bukan nilai eksak untuk semua amplitudo.","Tidak ada alasan massa berubah akibat simpangan besar.","","Gravitasi setempat tidak bertambah hanya karena amplitudo bandul diperbesar."],"id":"M30","level":2,"index":9}];
